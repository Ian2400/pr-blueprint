<svg width="100%" viewBox="0 0 480 985" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What the generated check does</title>
<desc>Nine steps on a developer's branch: track the work, scan secrets and PII, scan vulnerabilities, run code checks, review the diff, triage by vote into Fix with AI / Surface / Note, resolve with risk-tiered fix agents, write the PR description with deploy and revert plans, and open the draft PR. It also learns from reviewer feedback.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
rect{stroke-width:1}
.bg-gray{fill:#F1EFE8;stroke:#5F5E5A}
.bg-purple{fill:#EEEDFE;stroke:#534AB7}
.bg-teal{fill:#E1F5EE;stroke:#0F6E56}
.t-gray{fill:#444441}
.ts-gray{fill:#5F5E5A}
.t-purple{fill:#3C3489}
.ts-purple{fill:#534AB7}
.t-teal{fill:#085041}
.ts-teal{fill:#0F6E56}
.arrow{stroke:#5F5E5A}
.cap{fill:#5F5E5A}
#arrowhead path{stroke:#5F5E5A}
@media (prefers-color-scheme: dark) {
  .bg-gray{fill:#444441;stroke:#B4B2A9}
  .bg-purple{fill:#3C3489;stroke:#AFA9EC}
  .bg-teal{fill:#085041;stroke:#5DCAA5}
  .t-gray{fill:#D3D1C7}
  .ts-gray{fill:#B4B2A9}
  .t-purple{fill:#CECBF6}
  .ts-purple{fill:#AFA9EC}
  .t-teal{fill:#9FE1CB}
  .ts-teal{fill:#5DCAA5}
  .arrow{stroke:#B4B2A9}
  .cap{fill:#B4B2A9}
  #arrowhead path{stroke:#B4B2A9}
}
</style>
<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect class="bg-gray" x="120" y="40" width="240" height="56" rx="8"/>
<text class="th t-gray" x="240" y="58" text-anchor="middle" dominant-baseline="central">1. Track the work</text>
<text class="ts ts-gray" x="240" y="78" text-anchor="middle" dominant-baseline="central">Find or draft the issue</text>
</g>
<line x1="240" y1="96" x2="240" y2="132" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="120" y="132" width="240" height="56" rx="8"/>
<text class="th t-purple" x="240" y="150" text-anchor="middle" dominant-baseline="central">2. Scan secrets &amp; PII</text>
<text class="ts ts-purple" x="240" y="170" text-anchor="middle" dominant-baseline="central">Blocks push until resolved</text>
</g>
<line x1="240" y1="188" x2="240" y2="224" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="120" y="224" width="240" height="56" rx="8"/>
<text class="th t-purple" x="240" y="242" text-anchor="middle" dominant-baseline="central">3. Scan vulnerabilities</text>
<text class="ts ts-purple" x="240" y="262" text-anchor="middle" dominant-baseline="central">Scoped to the branch's diff</text>
</g>
<line x1="240" y1="280" x2="240" y2="316" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-gray" x="120" y="316" width="240" height="56" rx="8"/>
<text class="th t-gray" x="240" y="334" text-anchor="middle" dominant-baseline="central">4. Run code checks</text>
<text class="ts ts-gray" x="240" y="354" text-anchor="middle" dominant-baseline="central">Lint, developer picks fixes</text>
</g>
<line x1="240" y1="372" x2="240" y2="408" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-gray" x="120" y="408" width="240" height="56" rx="8"/>
<text class="th t-gray" x="240" y="426" text-anchor="middle" dominant-baseline="central">5. Review the diff</text>
<text class="ts ts-gray" x="240" y="446" text-anchor="middle" dominant-baseline="central">Checks for duplicate code too</text>
</g>
<line x1="240" y1="464" x2="240" y2="500" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="120" y="500" width="240" height="56" rx="8"/>
<text class="th t-purple" x="240" y="518" text-anchor="middle" dominant-baseline="central">6. Triage by vote</text>
<text class="ts ts-purple" x="240" y="538" text-anchor="middle" dominant-baseline="central">3 category + 3 risk voters</text>
</g>

<line x1="210" y1="556" x2="85" y2="592" class="arrow" marker-end="url(#arrowhead)"/>
<line x1="240" y1="556" x2="240" y2="592" class="arrow" marker-end="url(#arrowhead)"/>
<line x1="270" y1="556" x2="395" y2="592" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="20" y="596" width="130" height="44" rx="8"/>
<text class="th t-purple" x="85" y="618" text-anchor="middle" dominant-baseline="central">Fix with AI</text>
</g>
<g>
<rect class="bg-purple" x="175" y="596" width="130" height="44" rx="8"/>
<text class="th t-purple" x="240" y="618" text-anchor="middle" dominant-baseline="central">Surface</text>
</g>
<g>
<rect class="bg-purple" x="330" y="596" width="130" height="44" rx="8"/>
<text class="th t-purple" x="395" y="618" text-anchor="middle" dominant-baseline="central">Note</text>
</g>

<line x1="85" y1="640" x2="220" y2="676" class="arrow" marker-end="url(#arrowhead)"/>
<line x1="240" y1="640" x2="240" y2="676" class="arrow" marker-end="url(#arrowhead)"/>
<line x1="395" y1="640" x2="260" y2="676" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-teal" x="120" y="676" width="240" height="56" rx="8"/>
<text class="th t-teal" x="240" y="694" text-anchor="middle" dominant-baseline="central">7. Resolve</text>
<text class="ts ts-teal" x="240" y="714" text-anchor="middle" dominant-baseline="central">Risk-tiered, sign-off &#8805; 4</text>
</g>
<line x1="240" y1="732" x2="240" y2="768" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-teal" x="120" y="768" width="240" height="56" rx="8"/>
<text class="th t-teal" x="240" y="786" text-anchor="middle" dominant-baseline="central">8. Write PR description</text>
<text class="ts ts-teal" x="240" y="806" text-anchor="middle" dominant-baseline="central">Deploy &amp; revert plans</text>
</g>
<line x1="240" y1="824" x2="240" y2="860" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-gray" x="120" y="860" width="240" height="44" rx="8"/>
<text class="th t-gray" x="240" y="882" text-anchor="middle" dominant-baseline="central">9. Open draft PR</text>
</g>

<text class="ts cap" x="240" y="934" text-anchor="middle">&#8635; Learns: reviewer comments &amp; overrides &#8594; rules</text>
<text class="ts cap" x="240" y="958" text-anchor="middle">Gray = routine &#183; Purple = scans &amp; triage &#183; Teal = output</text>
</svg>
