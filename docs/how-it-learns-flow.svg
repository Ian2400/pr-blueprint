<svg width="100%" viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How your bespoke skill learns</title>
<desc>Three sources - a developer override, a reviewer comment read by learn, or a stated convention - become a lesson, which is filed as a feedback issue, grouped and checked for conflicts by consolidate, and opened as one rules PR for CODEOWNERS to approve into rules.md.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
rect{stroke-width:1}
.bg-gray{fill:#F1EFE8;stroke:#5F5E5A}
.bg-purple{fill:#EEEDFE;stroke:#534AB7}
.bg-teal{fill:#E1F5EE;stroke:#0F6E56}
.t-gray{fill:#444441}
.ts-gray{fill:#5F5E5A}
.t-purple{fill:#3C3489}
.ts-purple{fill:#534AB7}
.t-teal{fill:#085041}
.ts-teal{fill:#0F6E56}
.arrow{stroke:#5F5E5A}
.cap{fill:#5F5E5A}
#arrowhead path{stroke:#5F5E5A}
@media (prefers-color-scheme: dark) {
  .bg-gray{fill:#444441;stroke:#B4B2A9}
  .bg-purple{fill:#3C3489;stroke:#AFA9EC}
  .bg-teal{fill:#085041;stroke:#5DCAA5}
  .t-gray{fill:#D3D1C7}
  .ts-gray{fill:#B4B2A9}
  .t-purple{fill:#CECBF6}
  .ts-purple{fill:#AFA9EC}
  .t-teal{fill:#9FE1CB}
  .ts-teal{fill:#5DCAA5}
  .arrow{stroke:#B4B2A9}
  .cap{fill:#B4B2A9}
  #arrowhead path{stroke:#B4B2A9}
}
</style>
<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect class="bg-gray" x="20" y="40" width="130" height="44" rx="8"/>
<text class="th t-gray" x="85" y="62" text-anchor="middle" dominant-baseline="central">Override</text>
</g>
<g>
<rect class="bg-gray" x="175" y="40" width="130" height="44" rx="8"/>
<text class="th t-gray" x="240" y="62" text-anchor="middle" dominant-baseline="central">PR comment</text>
</g>
<g>
<rect class="bg-gray" x="330" y="40" width="130" height="44" rx="8"/>
<text class="th t-gray" x="395" y="62" text-anchor="middle" dominant-baseline="central">Convention</text>
</g>

<line x1="85" y1="84" x2="210" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
<line x1="240" y1="84" x2="240" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
<line x1="395" y1="84" x2="270" y2="120" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="120" y="120" width="240" height="56" rx="8"/>
<text class="th t-purple" x="240" y="138" text-anchor="middle" dominant-baseline="central">Lesson</text>
<text class="ts ts-purple" x="240" y="158" text-anchor="middle" dominant-baseline="central">Recorded in the ledger</text>
</g>
<line x1="240" y1="176" x2="240" y2="212" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="120" y="212" width="240" height="56" rx="8"/>
<text class="th t-purple" x="240" y="230" text-anchor="middle" dominant-baseline="central">Feedback issue</text>
<text class="ts ts-purple" x="240" y="250" text-anchor="middle" dominant-baseline="central">Labeled pr-check-feedback</text>
</g>
<line x1="240" y1="268" x2="240" y2="304" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-purple" x="120" y="304" width="240" height="56" rx="8"/>
<text class="th t-purple" x="240" y="322" text-anchor="middle" dominant-baseline="central">consolidate</text>
<text class="ts ts-purple" x="240" y="342" text-anchor="middle" dominant-baseline="central">Groups &amp; checks conflicts</text>
</g>
<line x1="240" y1="360" x2="240" y2="396" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-teal" x="120" y="396" width="240" height="56" rx="8"/>
<text class="th t-teal" x="240" y="414" text-anchor="middle" dominant-baseline="central">Rules PR</text>
<text class="ts ts-teal" x="240" y="434" text-anchor="middle" dominant-baseline="central">One PR per batch</text>
</g>
<line x1="240" y1="452" x2="240" y2="488" class="arrow" marker-end="url(#arrowhead)"/>

<g>
<rect class="bg-teal" x="120" y="488" width="240" height="56" rx="8"/>
<text class="th t-teal" x="240" y="506" text-anchor="middle" dominant-baseline="central">CODEOWNERS approve</text>
<text class="ts ts-teal" x="240" y="526" text-anchor="middle" dominant-baseline="central">Merges into rules.md</text>
</g>

<text class="ts cap" x="240" y="584" text-anchor="middle">&#8635; Future runs use the updated rules.md</text>
<text class="ts cap" x="240" y="608" text-anchor="middle">Gray=source &#183; Purple=recorded &#183; Teal=merged</text>
</svg>
